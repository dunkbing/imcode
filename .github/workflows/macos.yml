# a signed, notarized ImCode.app for apple silicon: on a v* tag (a draft release gets the zip)
# or by hand. secrets: MACOS_CERTIFICATE (the developer id application .p12, base64),
# MACOS_CERTIFICATE_PASSWORD, NOTARY_KEY (an app store connect api key .p8, base64),
# NOTARY_KEY_ID, NOTARY_ISSUER. variables, optional: IMCODE_APPCAST_URL, IMCODE_UPDATE_KEY
name: macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: vcpkg cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-osx-${{ hashFiles('vcpkg.json') }}

      - name: Signing keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          echo "IMCODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          IMCODE_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          IMCODE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          IMCODE_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          IMCODE_APPCAST_URL: ${{ vars.IMCODE_APPCAST_URL }}
          IMCODE_UPDATE_KEY: ${{ vars.IMCODE_UPDATE_KEY }}
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT" VCPKG_BINARY_SOURCES="clear;files,$HOME/.cache/vcpkg/archives,readwrite"
          mkdir -p "$HOME/.cache/vcpkg/archives"
          case "$GITHUB_REF" in refs/tags/v*) export IMCODE_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          ./scripts/package-macos.sh
          spctl -a -vv dist/ImCode.app

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: imcode-macos-arm64
          path: dist/imcode-macos-arm64.zip

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/imcode-macos-arm64.zip
